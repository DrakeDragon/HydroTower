<script>
var Engine=(function(){
var P={visc:.003,imp:.08,xd:.1,ov:.25,fric:0};
var W=360,GRAV=900,VMAX=470,CELL=6,HS=4096,BK=64,MAXD=1900,DR=2.5,TAU=Math.PI*2;
function Sim(T){
  this.T=T;this.n=0;
  this.x=new Float32Array(MAXD);this.y=new Float32Array(MAXD);this.vx=new Float32Array(MAXD);this.vy=new Float32Array(MAXD);this.age=new Float32Array(MAXD);
  this.nxt=new Int32Array(MAXD);this.head=new Int32Array(HS);
  this.t=0;this.acc=0;this.rate=20;this.emit={y:0,x0:150,x1:210,vy:60};this.win={y0:-1e9,y1:1e9};
  this.out=0;this.aw=[];this.seed=12345;

}
Sim.prototype.rnd=function(){var t=this.seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};

  var T=this.T,b=this.bands=[];
  function add(i0,i1,k,o){i0=Math.max(0,(i0/BK)|0);i1=Math.max(0,(i1/BK)|0);for(var i=i0;i<=i1;i++){var e=b[i]||(b[i]={s:[],c:[],w:[],z:[]});e[k].push(o);}}
  T.segs.forEach(function(s){s.l2=(s.x2-s.x1)*(s.x2-s.x1)+(s.y2-s.y1)*(s.y2-s.y1);if(s.on===undefined)s.on=true;add(Math.min(s.y1,s.y2)-14,Math.max(s.y1,s.y2)+14,'s',s);});
  T.circs.forEach(function(c){add(c.y-c.r-14,c.y+c.r+14,'c',c);});
  T.wheels.forEach(function(w){add(w.y-w.R-14,w.y+w.R+14,'w',w);});
  T.zones.forEach(function(z){add(z.y1-14,z.y2+14,'z',z);});
};
Sim.prototype.setWindow=function(y0,y1){
  this.win.y0=y0;this.win.y1=y1;
  var T=this.T;this.aw=T.wheels.filter(function(w){return w.y+w.R>y0-20&&w.y-w.R<y1+20;});
  this.aw.forEach(function(w){if(!w.act){w.act=true;if(Math.abs(w.w)<0.3)w.w=w.dir*1.5;}});
  T.wheels.forEach(function(w){if(this.aw.indexOf(w)<0)w.act=false;},this);
  for(var i=this.n-1;i>=0;i--)if(this.y[i]<y0-30||this.y[i]>y1+30)this.kill(i);
};
Sim.prototype.kill=function(i){var n=--this.n;if(i!==n){this.x[i]=this.x[n];this.y[i]=this.y[n];this.vx[i]=this.vx[n];this.vy[i]=this.vy[n];this.age[i]=this.age[n];}};
Sim.prototype.spawn=function(x,y,vx,vy){if(this.n>=MAXD)return;var i=this.n++;this.x[i]=x;this.y[i]=y;this.vx[i]=vx;this.vy[i]=vy;this.age[i]=0;};
function wheelHit(sim,w,i){
  var dx=sim.x[i]-w.x,dy=sim.y[i]-w.y,Rr=w.R+DR+2;
  if(dx*dx+dy*dy>Rr*Rr)return;
  var n=w.n,lim=DR+2.2;
  for(var k=0;k<n;k++){
    var a=w.ang+k*TAU/n,ca=Math.cos(a),sa=Math.sin(a),tl=dx*ca+dy*sa;
    if(tl<0)tl=0;else if(tl>w.R)tl=w.R;
    var px=ca*tl,py=sa*tl,ex=dx-px,ey=dy-py,dd=ex*ex+ey*ey;
    if(dd<lim*lim){
      var d=Math.sqrt(dd)||1e-3,nx=ex/d,ny=ey/d,pen=lim-d;
      sim.x[i]+=nx*pen;sim.y[i]+=ny*pen;dx+=nx*pen;dy+=ny*pen;
      var rvx=sim.vx[i]+w.w*py,rvy=sim.vy[i]-w.w*px,vn=rvx*nx+rvy*ny;
      if(vn<0){var j=-1.12*vn;sim.vx[i]+=nx*j;sim.vy[i]+=ny*j;w.w+=-j*(px*ny-py*nx)/w.I;}
    }
  }
}
Sim.prototype.step=function(dt){
  var T=this.T,i,j,x=this.x,y=this.y,vx=this.vx,vy=this.vy;
  this.t+=dt;
  for(i=0;i<T.gates.length;i++){var g=T.gates[i];g.s.on=((this.t+g.ph)%g.per)<g.per*g.closed;}
  for(i=0;i<this.aw.length;i++){var w=this.aw[i];w.w-=w.w*w.drag*dt;if(w.w>6)w.w=6;else if(w.w<-6)w.w=-6;w.ang+=w.w*dt;w.E+=w.I*w.drag*w.w*w.w*dt;}
  // emit
  this.acc+=this.rate*dt;
  var em=this.emit;
  while(this.acc>=1){this.acc-=1;this.spawn(em.x0+this.rnd()*(em.x1-em.x0),em.y,(this.rnd()-.5)*40,em.vy+this.rnd()*40);}
  var y1=this.win.y1+20;
  for(i=0;i<this.n;i++){
    this.age[i]+=dt;
    vy[i]+=GRAV*dt;
    var px=x[i],py=y[i];
    var bi=(py/BK)|0,b=this.bands[bi];
    if(b){
      for(j=0;j<b.z.length;j++){var z=b.z[j];
        if(px>z.x1&&px<z.x2&&py>z.y1&&py<z.y2){
          if(z.k==='jet'){vx[i]+=z.ax*dt;vy[i]+=z.ay*dt;}
          else{var rx=px-z.cx,ry=py-z.cy,rl=Math.sqrt(rx*rx+ry*ry)||1;vx[i]+=-ry/rl*z.f*dt;vy[i]+=rx/rl*z.f*dt*0.5;vx[i]-=rx/rl*z.pull*dt;}
        }}
    }
    var sp=vx[i]*vx[i]+vy[i]*vy[i];if(sp>VMAX*VMAX){var f=VMAX/Math.sqrt(sp);vx[i]*=f;vy[i]*=f;}

    x[i]+=vx[i]*dt;y[i]+=vy[i]*dt;
    if(x[i]<DR+4){x[i]=DR+4;if(vx[i]<0)vx[i]*=-0.2;}else if(x[i]>W-DR-4){x[i]=W-DR-4;if(vx[i]>0)vx[i]*=-0.2;}
    b=this.bands[(y[i]/BK)|0];
    if(b){
      var k;
      for(k=0;k<b.s.length;k++){var s=b.s[k];if(!s.on)continue;
        var dx=s.x2-s.x1,dy=s.y2-s.y1,t=((x[i]-s.x1)*dx+(y[i]-s.y1)*dy)/s.l2;t=t<0?0:t>1?1:t;
        var ex=x[i]-(s.x1+dx*t),ey=y[i]-(s.y1+dy*t),dd=ex*ex+ey*ey,lim=DR+2;
        if(dd<lim*lim){var d=Math.sqrt(dd)||1e-3,nx=ex/d,ny=ey/d;
          if(d<1e-2){nx=-dy;ny=dx;var nl=Math.sqrt(nx*nx+ny*ny);nx/=nl;ny/=nl;if(ny>0){nx=-nx;ny=-ny;}d=0;}
          var pen=lim-d;x[i]+=nx*pen;y[i]+=ny*pen;
          var vn=vx[i]*nx+vy[i]*ny;
          if(vn<0){vx[i]-=1.08*vn*nx;vy[i]-=1.08*vn*ny;var tx=-ny,ty=nx,vt=vx[i]*tx+vy[i]*ty;vx[i]-=vt*P.fric*tx;vy[i]-=vt*P.fric*ty;}
        }}
      for(k=0;k<b.c.length;k++){var c=b.c[k];var ex2=x[i]-c.x,ey2=y[i]-c.y,lm=DR+c.r,d2=ex2*ex2+ey2*ey2;
        if(d2<lm*lm){var dd2=Math.sqrt(d2)||1e-3,n2x=ex2/dd2,n2y=ey2/dd2;x[i]+=n2x*(lm-dd2);y[i]+=n2y*(lm-dd2);var vn2=vx[i]*n2x+vy[i]*n2y;if(vn2<0){vx[i]-=1.25*vn2*n2x;vy[i]-=1.25*vn2*n2y;}}}
      for(k=0;k<b.w.length;k++){if(b.w[k].act)wheelHit(this,b.w[k],i);}
    }
  }
  // drop-drop
  var head=this.head,nxt=this.nxt;head.fill(-1);
  for(i=0;i<this.n;i++){var key=(((x[i]/CELL)|0)*73856093^((y[i]/CELL)|0)*19349663)&(HS-1);nxt[i]=head[key];head[key]=i;}
  for(i=0;i<this.n;i++){
    var cx=(x[i]/CELL)|0,cy=(y[i]/CELL)|0;
    for(var ax=-1;ax<=1;ax++)for(var ay=-1;ay<=1;ay++){
      j=head[(((cx+ax)*73856093)^((cy+ay)*19349663))&(HS-1)];
      while(j>=0){
        if(j>i){var ddx=x[j]-x[i],ddy=y[j]-y[i],q=ddx*ddx+ddy*ddy;
          if(q<26){var d=Math.sqrt(q)||0.05,nx=ddx/d,ny=ddy/d,ov=(5.1-d)*P.ov;
            if(q===0){nx=0;ny=1;}
            x[i]-=nx*ov;y[i]-=ny*ov;x[j]+=nx*ov;y[j]+=ny*ov;
            var rvn=(vx[j]-vx[i])*nx+(vy[j]-vy[i])*ny;
            if(rvn<0){var im=rvn*P.imp;vx[i]+=nx*im;vy[i]+=ny*im;vx[j]-=nx*im;vy[j]-=ny*im;}
            var avx=(vx[i]+vx[j])*0.5,avy=(vy[i]+vy[j])*0.5;
            vx[i]+=(avx-vx[i])*P.visc;vx[j]+=(avx-vx[j])*P.visc;vy[i]+=(avy-vy[i])*P.visc;vy[j]+=(avy-vy[j])*P.visc;
          }}

      }
    }
  }
  for(i=this.n-1;i>=0;i--){if(y[i]>y1){this.out++;this.kill(i);}}
};

})();
if(typeof module!=='undefined')module.exports=Engine;

var Tower=(function(){
var W=360,TAU=Math.PI*2,N=30;
function rng(s){return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function B(){return {segs:[],circs:[],wheels:[],zones:[],gates:[]};}
function seg(b,x1,y1,x2,y2){var s={x1:x1,y1:y1,x2:x2,y2:y2,on:true};b.segs.push(s);return s;}
function wheel(b,x,y,R,n,drag,dir,mul){var w={x:x,y:y,R:R,n:n,ang:Math.random()*6,w:0,dir:dir,I:n*R*R*3.5*(mul||1),drag:drag,E:0,act:false};b.wheels.push(w);return w;}
var SECT={
chute:function(b,y,v){var sp=(W-v.g)*v.sl+v.pad;for(var i=0;i<v.k;i++){var yy=y+22+i*sp,d=(W-v.g)*v.sl;if(i%2===0)seg(b,0,yy,W-v.g,yy+d);else seg(b,W,yy,v.g,yy+d);}return v.k*sp+34;},
fw:function(b,y,v){var yf=y+20,cx=v.cx,hw=v.gw/2;seg(b,0,yf,cx-hw,yf+v.d);seg(b,W,yf,cx+hw,yf+v.d);
  var wx=cx+v.off,wy=yf+v.d+v.R*0.8;wheel(b,wx,wy,v.R,v.n,v.drag,v.off>0?-1:1);
  var h=v.d+v.R*2+10;
  if(v.two){var w2=wx+(v.off>0?-1:1)*(v.R*2+18);if(w2>v.R+8&&w2<W-v.R-8){wheel(b,w2,wy+v.R*1.5,v.R*0.8,v.n,v.drag,v.off>0?1:-1);h+=v.R*1.6;}}
  return h+34;},
basin:function(b,y,v){var yf=y+20,cx=v.cx,hw=v.hole/2;seg(b,0,yf,cx-hw,yf+v.d);seg(b,W,yf,cx+hw,yf+v.d);
  wheel(b,cx+v.off,yf+v.d+v.R*0.9,v.R,v.n,v.drag,v.off>=0?-1:1,0.8);return v.d+v.R*2+40;},
stairs:function(b,y,v){for(var i=0;i<v.k;i++){var yy=y+22+i*v.sp,len=v.len;if(i%2===0)seg(b,0,yy,len,yy+len*v.sl);else seg(b,W,yy,W-len,yy+len*v.sl);
    if(false){var lx=i%2===0?len:W-len,ly=yy+len*v.sl;seg(b,lx,ly,lx,ly-9);}}
  return v.k*v.sp+len0(v)+10;},
flume:function(b,y,v){var y0=y+24,xe=W-v.endx,ye=y0+xe*v.sl;seg(b,0,y0,xe,ye);
  b.zones.push({k:'jet',x1:0,x2:xe,y1:y0-17,y2:ye,ax:v.jet,ay:0});
  var wx=xe+v.R*0.3,wy=ye+v.R*0.9;wheel(b,wx,wy,v.R,v.n,v.drag,-1);

whirl:function(b,y,v){var yf=y+20,cx=v.cx,hw=v.hole/2;seg(b,0,yf,cx-hw,yf+v.d);seg(b,W,yf,cx+hw,yf+v.d);
  b.zones.push({k:'vor',x1:cx-80,x2:cx+80,y1:yf+v.d*0.2,y2:yf+v.d+30,cx:cx,cy:yf+v.d*0.8,f:v.f,pull:v.pull});
  wheel(b,cx,yf+v.d+v.R*0.9+8,v.R,v.n,v.drag,1,0.8);return v.d+v.R*2+50;},
sluice:function(b,y,v){var yf=y+20,cx=v.cx,hw=v.gw/2;seg(b,0,yf,cx-hw,yf+v.d);seg(b,W,yf,cx+hw,yf+v.d);

};
function cx_(v){return v.cx-v.hole/2;}
function len0(v){return v.len*v.sl;}
var KINDS=Object.keys(SECT);
var HAS_WHEEL={fw:1,basin:1,flume:1,whirl:1,sluice:1};
function ir(r,a,b){return Math.round(a+r()*(b-a));}
function fr(r,a,b){return a+r()*(b-a);}

  if(kind==='stairs'){v.k=ir(Math.random,4,6);v.sl=.21+Math.random()*.05;v.lip=false;v.len=Math.min(v.len,215);v.sp=Math.max(v.sp,Math.round(v.len*v.sl+34));}
  if(kind==='sluice'){v.d=Math.min(v.d,50);v.gw=Math.max(v.gw,34);v.R=Math.min(v.R,42);}

}

  else if(t.dataset.stage){buyStage();build();}
  else if(t.dataset.crate){buyCrate();}
  else if(t.dataset.evap){if(confirm('Evaporate and restart with clouds?'))evaporate();}
  else if(t.dataset.act!==undefined&&t.dataset.act!==''){G.act=+t.dataset.act;save();build();}
  else if(t.dataset.go){focusStage(+t.dataset.go);close();}});
/* ---------- render ---------- */
var pal=STG.map(function(s){return s.pal;});var bgCache={};
function bgGrad(i){if(bgCache[i])return bgCache[i];var st=STG[i],g=ctx.createLinearGradient(0,st.y0,0,st.y1);g.addColorStop(0,pal[i].bg1);g.addColorStop(1,pal[i].bg2);bgCache[i]=g;return g;}
function wcol(){var s=SP[G.act];return s?'hsl('+s.h+',82%,62%)':'hsl(208,85%,62%)';}
var fr=0,lastT=performance.now(),acc=0,payT=0,minimapOn=true;
function line(s){ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);}
function draw(){
  var k=dpr*sc;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0a1230';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(k,0,0,k,0,-cam.y*k);
  var v0=cam.y-20,v1=cam.y+vh()+20;
  // future ghost stage
  var maxS=Math.min(STG.length,G.top+1);
  for(var i=0;i<maxS;i++){var st=STG[i];if(st.y1<v0||st.y0>v1)continue;var ghost=i===G.top;
    ctx.globalAlpha=ghost?0.28:1;ctx.fillStyle=bgGrad(i);ctx.fillRect(0,st.y0,W,st.h+1);
    // wall strips + rivets
    ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,st.y0,6,st.h);ctx.fillRect(W-6,st.y0,6,st.h);
    ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;ctx.beginPath();for(var y=st.y0+30;y<st.y1;y+=60){ctx.moveTo(6,y);ctx.lineTo(W-6,y);}ctx.stroke();
    // statics
    var pl=pal[i];ctx.lineCap='round';ctx.strokeStyle=pl.stone;ctx.lineWidth=6;ctx.beginPath();
    for(var q=0;q<T.segs.length;q++){var s=T.segs[q];if(s.y1<st.y0||s.y1>st.y1||!s.on||s.gate)continue;if(Math.max(s.y1,s.y2)<v0||Math.min(s.y1,s.y2)>v1)continue;line(s);}ctx.stroke();
    ctx.fillStyle=pl.stone;for(var q2=0;q2<T.circs.length;q2++){var c=T.circs[q2];if(c.y<st.y0||c.y>st.y1)continue;if(c.y<v0||c.y>v1)continue;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();}
    // gate segs
    ctx.strokeStyle=pl.acc;ctx.lineWidth=5;ctx.beginPath();for(var g=0;g<T.gates.length;g++){var gs=T.gates[g].s;if(gs.y1<st.y0||gs.y1>st.y1||!gs.on)continue;line(gs);}ctx.stroke();
    // zones
    for(var z=0;z<T.zones.length;z++){var zo=T.zones[z];if(zo.y1<st.y0||zo.y2>st.y1+60)continue;if(zo.k==='jet'){ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.5;ctx.beginPath();var off=(fr*2)%30;for(var xx=zo.x1+off;xx<zo.x2;xx+=30){ctx.moveTo(xx,zo.y2-8);ctx.lineTo(xx+8,zo.y2-12);ctx.lineTo(xx,zo.y2-16);}ctx.stroke();}
      else{ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;for(var rr=1;rr<=3;rr++){ctx.beginPath();ctx.ellipse(zo.cx,zo.cy,rr*18,rr*7,0,fr*0.05*rr,fr*0.05*rr+4.2);ctx.stroke();}}}
    // wheels
    for(var w=0;w<T.wheels.length;w++){var wh=T.wheels[w];if(wh.st!==st.s)continue;if(wh.y+wh.R<v0||wh.y-wh.R>v1)continue;
      var sp=Math.min(1,Math.abs(wh.w)/4);
      if(sp>0.25&&!ghost){ctx.fillStyle='rgba(255,224,140,'+(0.12*sp)+')';ctx.beginPath();ctx.arc(wh.x,wh.y,wh.R+8+sp*4,0,TAU);ctx.fill();}
      ctx.strokeStyle=pl.acc;ctx.lineWidth=5;ctx.beginPath();for(var p=0;p<wh.n;p++){var a=wh.ang+p*TAU/wh.n;ctx.moveTo(wh.x,wh.y);ctx.lineTo(wh.x+Math.cos(a)*wh.R,wh.y+Math.sin(a)*wh.R);}ctx.stroke();
      ctx.strokeStyle=pl.glow;ctx.globalAlpha=(ghost?0.28:1)*0.5;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(wh.x,wh.y,wh.R*0.55,wh.ang,wh.ang+2);ctx.stroke();ctx.globalAlpha=ghost?0.28:1;
      ctx.fillStyle='#14182c';ctx.beginPath();ctx.arc(wh.x,wh.y,7,0,TAU);ctx.fill();ctx.fillStyle=pl.glow;ctx.beginPath();ctx.arc(wh.x,wh.y,3.2,0,TAU);ctx.fill();}
    ctx.globalAlpha=1;
  }
  // nozzle & title banner at top stage
  var ty=topY()-34;if(ty>v0-60&&ty<v1){ctx.fillStyle='#8aa0d8';ctx.fillRect(W/2-34,ty-34,68,12);ctx.fillRect(W/2-24,ty-24,48,20);ctx.fillStyle='#4a5f9c';ctx.fillRect(W/2-14,ty-6,28,8);}
  // drops
  var X=SIM.x,Y=SIM.y,n=SIM.n,r=3.1;
  ctx.fillStyle=wcol();ctx.globalAlpha=.92;ctx.beginPath();
  for(var d=0;d<n;d++){var yy=Y[d];if(yy<v0||yy>v1)continue;ctx.moveTo(X[d]+r,yy);ctx.arc(X[d],yy,r,0,TAU);}ctx.fill();
  ctx.globalAlpha=.55;ctx.fillStyle='#fff';ctx.beginPath();
  for(var d2=0;d2<n;d2+=1){var y2=Y[d2];if(y2<v0||y2>v1)continue;ctx.moveTo(X[d2]-.6+1.3,y2-1.1);ctx.arc(X[d2]-.6,y2-1.1,1.3,0,TAU);}ctx.fill();ctx.globalAlpha=1;
  // reservoir
  if(HB+80>v0){var lv=Math.min(46,10+Math.log10(1+G.earned)*3);ctx.fillStyle='rgba(20,30,70,.9)';ctx.fillRect(0,HB,W,200);ctx.fillStyle=wcol();ctx.globalAlpha=.55;ctx.fillRect(0,HB+60-lv,W,lv+140);ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(0,HB+60-lv,W,2);}
  // popups
  ctx.textAlign='center';for(var pu=popups.length-1;pu>=0;pu--){var p2=popups[pu];p2.t+=1/60;if(p2.t>1.2){popups.splice(pu,1);continue;}
    ctx.globalAlpha=1-p2.t/1.2;ctx.fillStyle=p2.big?'#ffd27a':'#fff';ctx.font='bold '+(p2.big?15:12)+'px system-ui';ctx.fillText(p2.s,p2.x,p2.y-p2.t*30);}
  ctx.globalAlpha=1;
  // minimap (screen space)
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var mx=cw-9,mt=100,mb=ch-150,ts=STG[G.top-1].y0-30,span=HB-ts;if(span>0&&mb>mt){
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(mx,mt,5,mb-mt);
    for(var m=0;m<G.top;m++){var a=mt+(STG[m].y0-ts)/span*(mb-mt),b2=mt+(STG[m].y1-ts)/span*(mb-mt);ctx.fillStyle=pal[m].acc;ctx.fillRect(mx,a+1,5,Math.max(1,b2-a-2));}
    var ca=mt+(cam.y-ts)/span*(mb-mt),cb=mt+(cam.y+vh()-ts)/span*(mb-mt);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(mx-2,Math.max(mt-4,ca),9,Math.max(8,cb-ca));}
}
function visibleStage(){var c=cam.y+vh()*0.45;for(var i=0;i<G.top;i++)if(c>=STG[i].y0&&c<STG[i].y1)return i+1;return G.top;}
function frame(now){
  var dt=Math.min(0.1,(now-lastT)/1000);lastT=now;fr++;
  var r=inc(),g=r*dt;G.coins+=g;G.earned+=g;G.life+=g;
  cam.idle+=dt;cam.y+=(cam.ty-cam.y)*Math.min(1,dt*5);if(drag&&drag.m>8)cam.ty=cam.y;
  syncWindow();
  acc+=dt;var steps=0;while(acc>=1/120&&steps<5){SIM.step(1/120);acc-=1/120;steps++;}if(steps>=5)acc=0;
  payT+=dt;if(payT>1.1){payT=0;var vs=visibleStage();var ws=T.wheels.filter(function(w){return w.st===vs&&w.act;});if(ws.length){var w=ws[(Math.random()*ws.length)|0];popups.push({x:w.x,y:w.y-w.R,t:0,s:'+'+fmt(Econ.stageInc(G,SP,vs)*1.1)});}}
  $('coins').textContent=fmt(G.coins);$('rate').textContent=fmt(r)+' / sec';
  var vsn=visibleStage();$('stg').textContent='Stage '+vsn+' · '+STG[vsn-1].name+' · '+STG[vsn-1].label;
  if(fr%6===0){quick();if(S.sheet&&fr%30===0)build_light();}
  draw();requestAnimationFrame(frame);
}
function build_light(){var b=$('shBody');if(S.sheet==='up'){var btns=b.querySelectorAll('[data-up]');btns.forEach(function(e){var k=e.dataset.up,d=Econ.UP[k];if(e.textContent==='🔒'||e.textContent==='MAX')return;e.disabled=G.coins<Econ.upCost(k,G.up[k]);});}
  else if(S.sheet==='tower'){var b2=b.querySelector('[data-stage]');if(b2)b2.disabled=G.coins<Econ.stageCost(G.top+1);}
  else if(S.sheet==='spr'){var c=b.querySelector('[data-crate]');if(c)c.disabled=G.coins<crateCost();}}
setInterval(save,5000);document.addEventListener('visibilitychange',function(){if(document.hidden)save();});window.addEventListener('pagehide',save);
window.__hy={G:function(){return G;},SIM:SIM,T:T,set:function(o){Object.assign(G,o);},Econ:Econ,buyStage:buyStage,focus:focusStage,cam:cam};
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();
